name: Security

# Continuous Integration only — no deployment step here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Secret scan — this repo keeps a real .env locally (API keys, Qdrant
  # cloud creds); this job fails the build if a secret ever gets committed.
  # ────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz

      - name: Scan repository history for committed secrets
        run: gitleaks detect --source . --no-banner --redact

  # ────────────────────────────────────────────────────────────────────────
  # Dependency vulnerability audits
  # ────────────────────────────────────────────────────────────────────────
  python-dependency-audit:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt

  node-dependency-audit:
    name: Dependency Audit (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json

      - run: npm ci
      - run: npm audit --audit-level=high

  # ────────────────────────────────────────────────────────────────────────
  # Static security analysis — common Python security anti-patterns
  # (injection, hardcoded secrets/binds, unsafe deserialization, etc.)
  # ────────────────────────────────────────────────────────────────────────
  python-static-analysis:
    name: Static Analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install bandit
      - run: bandit -r backend -x backend/__pycache__ -ll
