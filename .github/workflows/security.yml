name: Security

# Continuous Integration only — no deployment step here.
#
# Every job below writes its full findings to security-reports/<tool>.json
# (same relative path in every job, every run) and uploads that as a
# downloadable run artifact — pass or fail — so results can be compared
# across runs without digging through raw logs.
#
# Gate policy:
#   - secret-scan / python-dependency-audit stay BLOCKING (nothing noisy or
#     unfixable has ever been found there — a hit should fail CI).
#   - node-dependency-audit / python-static-analysis are NON-BLOCKING
#     (continue-on-error) for now: known findings there are either
#     no-fix-on-npm (xlsx) / breaking-only (esbuild->vite v8) or reviewed
#     false positives (bandit B310/B608) — see repo conversation history.
#     They still run and still report every time; they just don't turn CI
#     red until a real fix is chosen and applied deliberately.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ────────────────────────────────────────────────────────────────────────
  # Secret scan — this repo keeps a real .env locally (API keys, Qdrant
  # cloud creds); this job fails the build if a secret ever gets committed.
  # BLOCKING — no known noise here.
  # ────────────────────────────────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks
        run: |
          curl -sSL -o gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          sudo tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz

      - name: Scan repository for committed secrets (report + gate)
        run: |
          set +e
          mkdir -p security-reports
          gitleaks detect --source . --no-banner --redact \
            --report-format json --report-path security-reports/gitleaks.json
          gate_status=$?
          set -e
          exit $gate_status

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-secret-scan
          path: security-reports/
          retention-days: 90
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────
  # Dependency vulnerability audits
  # ────────────────────────────────────────────────────────────────────────
  python-dependency-audit:
    name: Dependency Audit (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install pip-audit

      # BLOCKING — no known noise on the Python side yet.
      - name: pip-audit (report + gate)
        run: |
          set +e
          mkdir -p security-reports
          pip-audit -r requirements.txt
          gate_status=$?
          set -e
          pip-audit -r requirements.txt -f json -o security-reports/pip-audit.json || true
          exit $gate_status

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-python-deps
          path: security-reports/
          retention-days: 90
          if-no-files-found: ignore

  node-dependency-audit:
    name: Dependency Audit (Node)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/react-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/react-app/package-lock.json

      - run: npm ci

      # NON-BLOCKING (see policy note at top of file): xlsx has no npm fix,
      # esbuild->vite only fixes via a breaking vite v8 bump. Still reports
      # every finding every run via the uploaded artifact.
      - name: npm audit (report, non-blocking)
        continue-on-error: true
        run: |
          set +e
          mkdir -p "$GITHUB_WORKSPACE/security-reports"
          npm audit --audit-level=high
          gate_status=$?
          set -e
          npm audit --json > "$GITHUB_WORKSPACE/security-reports/npm-audit.json" || true
          exit $gate_status

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-node-deps
          path: security-reports/
          retention-days: 90
          if-no-files-found: ignore

  # ────────────────────────────────────────────────────────────────────────
  # Static security analysis — common Python security anti-patterns
  # (injection, hardcoded secrets/binds, unsafe deserialization, etc.)
  # ────────────────────────────────────────────────────────────────────────
  python-static-analysis:
    name: Static Analysis (bandit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install bandit

      # NON-BLOCKING (see policy note at top of file): current findings
      # (2x B310 urlopen, 1x B608) were reviewed as expected/false-positive
      # for this codebase. Still reports every finding every run.
      - name: bandit (report, non-blocking)
        continue-on-error: true
        run: |
          set +e
          mkdir -p security-reports
          bandit -r backend -x backend/__pycache__ -ll
          gate_status=$?
          set -e
          bandit -r backend -x backend/__pycache__ -ll -f json -o security-reports/bandit.json || true
          exit $gate_status

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports-bandit
          path: security-reports/
          retention-days: 90
          if-no-files-found: ignore
